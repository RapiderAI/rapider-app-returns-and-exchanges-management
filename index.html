<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rapider Returns &amp; Exchanges Management</title>
  <script src="https://kit.fontawesome.com/5b23df26dc.js" crossorigin="anonymous" defer></script>
  <script src="/assets/js/rapider-components.js" defer></script>
  <link rel="stylesheet" href="/assets/themes/rapider-tailwind-theme.css">
  <link rel="stylesheet" href="/assets/themes/crm-expenses-design.css">
  <style>
    body, html { margin: 0; padding: 0; height: 100%; width: 100%; overflow: hidden; }
    iframe#appFrame { width: 100%; height: 100%; border: none; }
  </style>
</head>
<body>
  <iframe id="appFrame" src="pages/dashboard/dashboard.html"></iframe>
  <script>
    const routes = {
  "dashboard": "pages/dashboard/dashboard.html",
  "rmas": "pages/rmas/rmas.html",
  "settlements-and-credits": "pages/settlements-and-credits/settlements-and-credits.html",
  "dock-inspection": "pages/dock-inspection/dock-inspection.html",
  "boris-intake": "pages/boris-intake/boris-intake.html",
  "fraud-and-claims": "pages/fraud-and-claims/fraud-and-claims.html",
  "policies": "pages/policies/policies.html",
  "portal-config": "pages/portal-config/portal-config.html",
  "sku-return-analytics": "pages/sku-return-analytics/sku-return-analytics.html",
  "rma-detail": "pages/rma-detail/rma-detail.html",
  "inspection-detail": "pages/inspection-detail/inspection-detail.html",
  "settlement-detail": "pages/settlement-detail/settlement-detail.html"
};
    function handleHash() {
      const hash = window.location.hash.replace(/^#\/?/, '').split('?')[0];
      const route = hash || 'dashboard';
      const target = routes[route] || routes['dashboard'];
      const iframe = document.getElementById('appFrame');
      if (iframe) iframe.src = target;
    }
    window.addEventListener('hashchange', handleHash);
    window.addEventListener('load', handleHash);
  </script>
</body>
</html>
